[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clash-royale-battle-engine"
version = "0.1.0"
description = "A compact Python interface for the native Clash Royale battle engine"
requires-python = ">=3.9"

[tool.setuptools]
packages = ["native_engine"]
package-dir = {native_engine = "."}

[tool.setuptools.package-data]
native_engine = ["standard_match.json"]
